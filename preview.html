<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise ❤️</title>

<style>

body{
margin:0;
overflow-x:hidden;
font-family:Arial;
background-size:cover;
background-position:center;
transition:background-image 2s;
}

/* overlay */

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.35);
z-index:-1;
}

/* countdown */

.countdown{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
color:white;
font-size:28px;
background:rgba(0,0,0,0.4);
padding:10px 20px;
border-radius:10px;
}

/* gift */

.gift{
font-size:100px;
text-align:center;
margin-top:40vh;
cursor:pointer;
}

/* hidden */

.hidden{
display:none;
}

/* stories */

.story{
width:250px;
height:420px;
margin:40px auto;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,0.8);
}

.story img{
width:100%;
height:100%;
object-fit:cover;
}

/* 3D gallery */

.gallery{
width:300px;
height:300px;
margin:80px auto;
position:relative;
transform-style:preserve-3d;
animation:rotate 20s linear infinite;
}

.gallery img{
position:absolute;
width:200px;
height:200px;
object-fit:cover;
left:50px;
top:50px;
}

.gallery img:nth-child(1){transform:rotateY(0deg) translateZ(200px);}
.gallery img:nth-child(2){transform:rotateY(90deg) translateZ(200px);}
.gallery img:nth-child(3){transform:rotateY(180deg) translateZ(200px);}
.gallery img:nth-child(4){transform:rotateY(270deg) translateZ(200px);}

@keyframes rotate{
from{transform:rotateY(0deg)}
to{transform:rotateY(360deg)}
}

/* hearts */

.heart{
position:fixed;
font-size:20px;
pointer-events:none;
}

/* scroll animation */

.fade{
opacity:0;
transform:translateY(50px);
transition:1s;
}

.fade.show{
opacity:1;
transform:translateY(0);
}

/* secret message */

#secret{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
color:black;
padding:40px;
border-radius:10px;
font-size:26px;
text-align:center;
}

/* confetti */

canvas{
position:fixed;
top:0;
left:0;
pointer-events:none;
}

</style>

</head>

<body>

<canvas id="confetti"></canvas>

<div class="countdown" id="timer"></div>

<div class="gift" onclick="openGift()">🎁</div>

<div id="content" class="hidden">

<div class="story fade">
<img id="storyImg">
</div>

<div class="gallery fade">

<img src="photo1.jpg">
<img src="photo2.jpg">
<img src="photo3.jpg">
<img src="photo4.jpg">

</div>

<audio autoplay loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

</div>

<div id="secret">
Happy Birthday ❤️  
You are the most special person in my life.
</div>

<script>

/* BACKGROUND SLIDESHOW */

const bg=["bg1.jpg","bg2.jpg","bg3.jpg"]

let b=0

function changeBG(){

document.body.style.backgroundImage=`url(${bg[b]})`
b=(b+1)%bg.length

}

setInterval(changeBG,5000)
changeBG()

/* COUNTDOWN */

const birthday=new Date("March 18, 2026 00:00:00").getTime()

setInterval(()=>{

let now=new Date().getTime()
let diff=birthday-now

let d=Math.floor(diff/(1000*60*60*24))
let h=Math.floor((diff%(1000*60*60*24))/(1000*60*60))
let m=Math.floor((diff%(1000*60*60))/(1000*60))
let s=Math.floor((diff%(1000*60))/1000)

document.getElementById("timer").innerHTML=
d+"d "+h+"h "+m+"m "+s+"s"

if(diff<=0){

document.getElementById("timer").innerHTML="🎉"
startConfetti()
document.getElementById("secret").style.display="block"

}

},1000)

/* OPEN GIFT */

function openGift(){

document.querySelector(".gift").style.display="none"
document.getElementById("content").classList.remove("hidden")

}

/* STORY */

const stories=["story1.jpg","story2.jpg","story3.jpg"]

let i=0

setInterval(()=>{

document.getElementById("storyImg").src=stories[i]
i=(i+1)%stories.length

},3000)

/* HEART FOLLOW MOUSE */

document.addEventListener("mousemove",e=>{

let heart=document.createElement("div")
heart.className="heart"
heart.innerHTML="❤️"

heart.style.left=e.clientX+"px"
heart.style.top=e.clientY+"px"

document.body.appendChild(heart)

setTimeout(()=>heart.remove(),800)

})

/* SCROLL ANIMATION */

const faders=document.querySelectorAll(".fade")

window.addEventListener("scroll",()=>{

faders.forEach(el=>{

const top=el.getBoundingClientRect().top

if(top<window.innerHeight-100){

el.classList.add("show")

}

})

})

/* CONFETTI */

const canvas=document.getElementById("confetti")
const ctx=canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight

let confetti=[]

function startConfetti(){

for(let i=0;i<200;i++){

confetti.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*6
})

}

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height)

ctx.fillStyle="yellow"

confetti.forEach(c=>{

ctx.beginPath()
ctx.arc(c.x,c.y,c.r,0,Math.PI*2)
ctx.fill()

c.y+=2

if(c.y>canvas.height) c.y=0

})

requestAnimationFrame(draw)

}

draw()

</script>

</body>
</html>
